[project]
name = "spider-pixi-template"
version = "0.1.0"
description = "Template Pixi project for running containerized tasks on Spider"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "linux-aarch64"]

[dependencies]
python = ">=3.11"

[tasks]
hello = "python $INIT_CWD/hello.py"

[tool.pixitainer]
output = "spider-pixi-template.sif"
add-file = ["hello.py:/opt/conf/hello.py"]
